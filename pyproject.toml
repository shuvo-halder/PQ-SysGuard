[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pqsysguard"
version = "0.1.0"
description = "Linux system-administration toolkit with post-quantum security and automated diagnosis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "PQ-SysGuard Team" }
]
keywords = ["system-administration", "monitoring", "troubleshooting", "security", "post-quantum", "ml-kem", "ml-dsa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "psutil>=5.9.8",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
pqc = [
    "liboqs-python>=0.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "types-psutil>=5.9.0",
    "bandit>=1.7.8",
]

[project.scripts]
pqsysguard = "pqsysguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pqsysguard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "RUF", # Ruff-specific
]
ignore = [
    "B008", # do not perform function calls in argument defaults (Typer uses typer.Option())
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # allow assert in tests
    "S105", # allow hardcoded test passwords/tokens
    "S106", # allow hardcoded test passwords
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "oqs.*",
    "liboqs.*",
    "psutil.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["pqsysguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101", "B404", "B603"]
