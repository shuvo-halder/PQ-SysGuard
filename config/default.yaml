general:
  app_name: "pqsysguard"
  environment: "production"
  log_level: "INFO"
  log_format: "json"

database:
  path: "pqsysguard.db"

monitor:
  interval_seconds: 5
  cpu_warning_percent: 75.0
  cpu_critical_percent: 90.0
  memory_warning_percent: 80.0
  memory_critical_percent: 90.0
  swap_warning_percent: 50.0
  swap_critical_percent: 80.0
  disk_warning_percent: 80.0
  disk_critical_percent: 90.0
  inode_warning_percent: 80.0
  inode_critical_percent: 90.0
  monitored_services:
    - "ssh"
    - "sshd"
    - "systemd-journald"
    - "cron"

troubleshoot:
  journal_log_lines: 100
  failed_units_check: true
  rules_file: "config/troubleshoot_rules.yaml"

security:
  ssh_config_path: "/etc/ssh/sshd_config"
  check_root_login: true
  check_password_auth: true
  check_open_ports: true
  check_file_permissions: true
  sensitive_files:
    - "/etc/shadow"
    - "/etc/passwd"
    - "/etc/sudoers"

vault:
  default_chunk_size: 1048576  # 1 MB chunk streaming
  kem_algorithm: "ML-KEM-768"
  sig_algorithm: "ML-DSA-65"
  argon2_time_cost: 3
  argon2_memory_cost: 65536     # 64 MB
  argon2_parallelism: 4
